
```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>열매&이삭 데일리 케어 노트</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-12">

    <!-- 상단 헤더 -->
    <header class="bg-amber-500 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold">🐾 환묘 케어 노트</h1>
        <div class="flex items-center gap-2">
            <button type="button" onclick="exportToCSV()" class="text-xs bg-amber-700 hover:bg-amber-800 text-white font-bold px-2 py-1.5 rounded-lg shadow transition-colors">
                📥 CSV 저장
            </button>
            <span id="currentDateDisplay" class="text-xs bg-amber-600 px-2 py-1.5 rounded"></span>
        </div>
    </header>

    <div class="max-w-md mx-auto p-4 space-y-6">

        <!-- 1. 오늘 케어 기록 입력 폼 -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-lg font-bold text-amber-600">📝 오늘의 일기</h2>
                <input type="date" id="logDate" onchange="loadLogForDate(this.value)" class="p-2 border rounded-xl bg-slate-50 text-sm font-semibold focus:outline-amber-500">
            </div>

            <!-- 대소변 (감자 & 맛동산 Counter) -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-blue-50 p-3 rounded-xl text-center border border-blue-100">
                    <label class="block text-sm font-bold text-blue-700 mb-1">🥔 감자 (소변)</label>
                    <div class="flex justify-center items-center gap-3">
                        <button type="button" onclick="changeVal('peeCount', -1)" class="w-8 h-8 bg-white shadow rounded-lg text-lg font-bold text-slate-600 active:scale-90">-</button>
                        <span id="peeCountDisplay" class="text-xl font-extrabold text-blue-900">0</span>
                        <button type="button" onclick="changeVal('peeCount', 1)" class="w-8 h-8 bg-white shadow rounded-lg text-lg font-bold text-slate-600 active:scale-90">+</button>
                    </div>
                </div>

                <div class="bg-amber-50 p-3 rounded-xl text-center border border-amber-100">
                    <label class="block text-sm font-bold text-amber-800 mb-1">💩 맛동산 (대변)</label>
                    <div class="flex justify-center items-center gap-3">
                        <button type="button" onclick="changeVal('poopCount', -1)" class="w-8 h-8 bg-white shadow rounded-lg text-lg font-bold text-slate-600 active:scale-90">-</button>
                        <span id="poopCountDisplay" class="text-xl font-extrabold text-amber-900">0</span>
                        <button type="button" onclick="changeVal('poopCount', 1)" class="w-8 h-8 bg-white shadow rounded-lg text-lg font-bold text-slate-600 active:scale-90">+</button>
                    </div>
                </div>
            </div>

            <!-- 음수량 입력 추가 -->
            <div class="bg-cyan-50 p-3 rounded-xl border border-cyan-100 flex items-center justify-between">
                <label class="text-sm font-bold text-cyan-800">💧 총 음수량 (ml)</label>
                <input type="number" id="waterIntake" step="5" placeholder="예: 150" class="w-1/2 p-2 border rounded-lg bg-white text-sm font-bold text-right focus:outline-cyan-500">
            </div>

            <!-- 밥 (동적 항목 추가) -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-bold text-slate-700">🥣 밥 (식사)</label>
                    <button type="button" onclick="addFoodRow()" class="text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded-lg font-bold">+ 항목 추가</button>
                </div>
                <div id="foodContainer" class="space-y-2"></div>
            </div>

            <!-- 간식 (동적 항목 추가) -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-bold text-slate-700">🐟 간식</label>
                    <button type="button" onclick="addSnackRow()" class="text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded-lg font-bold">+ 항목 추가</button>
                </div>
                <div id="snackContainer" class="space-y-2"></div>
            </div>

            <!-- 영양제 및 약 -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">💊 영양제 / 약 (종류 및 시간)</label>
                <input type="text" id="supplements" placeholder="예: 시스테이드 (9:30), 츄르약" class="w-full p-2 border rounded-xl bg-slate-50 text-sm">
            </div>

            <!-- 체중 & 활력 -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">⚖️ 체중 (kg)</label>
                    <input type="number" step="0.01" id="weight" placeholder="예: 4.15" class="w-full p-2 border rounded-xl bg-slate-50 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">✨ 활력 상태</label>
                    <input type="text" id="vitality" placeholder="예: OK, 양호, 기력없음" class="w-full p-2 border rounded-xl bg-slate-50 text-sm">
                </div>
            </div>

            <!-- 특이사항 메모 -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">💬 특이사항 메모</label>
                <textarea id="memo" rows="3" placeholder="예: 새벽에 화장실 들락날락함, 배변 자세잡고 그냥 나옴 등" class="w-full p-2 border rounded-xl bg-slate-50 text-sm"></textarea>
            </div>

            <button type="button" onclick="saveLog()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition-transform">
                오늘 기록 저장하기
            </button>
        </section>

        <!-- 2. 감자/맛동산 변화 추이 그래프 -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold mb-3 text-slate-700">📊 감자/맛동산 횟수 추이 (최근 7일)</h2>
            <div class="h-52 relative">
                <canvas id="toiletChart"></canvas>
            </div>
        </section>

        <!-- 3. 최근 기록 리스트 -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold mb-3 text-slate-700">📋 저장된 일기 목록</h2>
            <div id="logHistory" class="space-y-3 text-sm max-h-80 overflow-y-auto"></div>
        </section>
    </div>

    <script>
        let currentPee = 0;
        let currentPoop = 0;
        let toiletChartInstance = null;

        const today = new Date().toISOString().split('T')[0];

        function changeVal(type, val) {
            if (type === 'peeCount') {
                currentPee = Math.max(0, currentPee + val);
                document.getElementById('peeCountDisplay').innerText = currentPee;
            } else if (type === 'poopCount') {
                currentPoop = Math.max(0, currentPoop + val);
                document.getElementById('poopCountDisplay').innerText = currentPoop;
            }
        }

        function addFoodRow(type = '', amount = '', time = '') {
            const container = document.getElementById('foodContainer');
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-center food-row';
            row.innerHTML = `
                <input type="text" placeholder="종류(예: 인스턴티브)" value="${type}" class="food-type w-1/3 p-2 border rounded-lg bg-slate-50 text-xs">
                <input type="text" placeholder="양(예: 70% 또는 1/2)" value="${amount}" class="food-amount w-1/3 p-2 border rounded-lg bg-slate-50 text-xs">
                <input type="text" placeholder="시간(예: 7:50)" value="${time}" class="food-time w-1/3 p-2 border rounded-lg bg-slate-50 text-xs">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 font-bold px-1 text-sm">✕</button>
            `;
            container.appendChild(row);
        }

        function addSnackRow(type = '', amount = '', time = '') {
            const container = document.getElementById('snackContainer');
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-center snack-row';
            row.innerHTML = `
                <input type="text" placeholder="종류(예: 홍살 달고기)" value="${type}" class="snack-type w-1/3 p-2 border rounded-lg bg-slate-50 text-xs">
                <input type="text" placeholder="양(예: 1/2)" value="${amount}" class="snack-amount w-1/3 p-2 border rounded-lg bg-slate-50 text-xs">
                <input type="text" placeholder="시간" value="${time}" class="snack-time w-1/3 p-2 border rounded-lg bg-slate-50 text-xs">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 font-bold px-1 text-sm">✕</button>
            `;
            container.appendChild(row);
        }

        function getDynamicData(containerId, rowClass, prefix) {
            const rows = document.querySelectorAll(`#${containerId} .${rowClass}`);
            const data = [];
            rows.forEach(row => {
                const type = row.querySelector(`.${prefix}-type`).value.trim();
                const amount = row.querySelector(`.${prefix}-amount`).value.trim();
                const time = row.querySelector(`.${prefix}-time`).value.trim();
                if (type || amount || time) {
                    data.push({ type, amount, time });
                }
            });
            return data;
        }

        function saveLog() {
            const date = document.getElementById('logDate').value;
            if (!date) { alert('날짜를 선택하세요.'); return; }

            const foods = getDynamicData('foodContainer', 'food-row', 'food');
            const snacks = getDynamicData('snackContainer', 'snack-row', 'snack');

            const entry = {
                date,
                pee: currentPee,
                poop: currentPoop,
                water: document.getElementById('waterIntake').value,
                foods,
                snacks,
                supplements: document.getElementById('supplements').value,
                weight: document.getElementById('weight').value,
                vitality: document.getElementById('vitality').value,
                memo: document.getElementById('memo').value
            };

            let logs = JSON.parse(localStorage.getItem('catCareLogs') || '[]');
            logs = logs.filter(item => item.date !== date);
            logs.push(entry);
            logs.sort((a, b) => new Date(a.date) - new Date(b.date));

            localStorage.setItem('catCareLogs', JSON.stringify(logs));
            alert('기록이 저장되었습니다!');

            renderAll();
        }

        function deleteLog(targetDate) {
            if (!confirm(`${targetDate} 기록을 삭제하시겠습니까?`)) return;
            let logs = JSON.parse(localStorage.getItem('catCareLogs') || '[]');
            logs = logs.filter(item => item.date !== targetDate);
            localStorage.setItem('catCareLogs', JSON.stringify(logs));
            
            if (document.getElementById('logDate').value === targetDate) {
                resetForm();
            }
            renderAll();
        }

        function loadLogForDate(selectedDate) {
            resetForm(selectedDate);
            const logs = JSON.parse(localStorage.getItem('catCareLogs') || '[]');
            const log = logs.find(item => item.date === selectedDate);

            if (log) {
                currentPee = log.pee || 0;
                currentPoop = log.poop || 0;
                document.getElementById('peeCountDisplay').innerText = currentPee;
                document.getElementById('poopCountDisplay').innerText = currentPoop;
                document.getElementById('waterIntake').value = log.water || '';

                document.getElementById('foodContainer').innerHTML = '';
                if (log.foods && log.foods.length > 0) {
                    log.foods.forEach(f => addFoodRow(f.type, f.amount, f.time));
                } else {
                    addFoodRow();
                }

                document.getElementById('snackContainer').innerHTML = '';
                if (log.snacks && log.snacks.length > 0) {
                    log.snacks.forEach(s => addSnackRow(s.type, s.amount, s.time));
                } else {
                    addSnackRow();
                }

                document.getElementById('supplements').value = log.supplements || '';
                document.getElementById('weight').value = log.weight || '';
                document.getElementById('vitality').value = log.vitality || '';
                document.getElementById('memo').value = log.memo || '';
            }
        }

        function resetForm(targetDate = today) {
            document.getElementById('logDate').value = targetDate;
            document.getElementById('currentDateDisplay').innerText = targetDate;
            currentPee = 0;
            currentPoop = 0;
            document.getElementById('peeCountDisplay').innerText = 0;
            document.getElementById('poopCountDisplay').innerText = 0;
            document.getElementById('waterIntake').value = '';
            document.getElementById('foodContainer').innerHTML = '';
            document.getElementById('snackContainer').innerHTML = '';
            document.getElementById('supplements').value = '';
            document.getElementById('weight').value = '';
            document.getElementById('vitality').value = '';
            document.getElementById('memo').value = '';
            addFoodRow();
            addSnackRow();
        }

        function exportToCSV() {
            const logs = JSON.parse(localStorage.getItem('catCareLogs') || '[]');
            if (logs.length === 0) {
                alert('저장된 기록이 없습니다.');
                return;
            }

            const headers = ['날짜', '감자(소변)', '맛동산(대변)', '음수량(ml)', '밥(식사)', '간식', '약/영양제', '체중(kg)', '활력', '특이사항 메모'];
            
            const rows = logs.map(log => {
                const foodStr = log.foods ? log.foods.map(f => `${f.type} ${f.amount}${f.time ? '(' + f.time + ')' : ''}`).join(' / ') : '';
                const snackStr = log.snacks ? log.snacks.map(s => `${s.type} ${s.amount}${s.time ? '(' + s.time + ')' : ''}`).join(' / ') : '';

                return [
                    log.date,
                    log.pee,
                    log.poop,
                    log.water || 0,
                    `"${foodStr.replace(/"/g, '""')}"`,
                    `"${snackStr.replace(/"/g, '""')}"`,
                    `"${(log.supplements || '').replace(/"/g, '""')}"`,
                    log.weight || '',
                    `"${(log.vitality || '').replace(/"/g, '""')}"`,
                    `"${(log.memo || '').replace(/"/g, '""')}"`
                ];
            });

            // BOM 추가로 엑셀 한글 깨짐 방지
            let csvContent = '\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `환묘_케어_노트_${today}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function renderAll() {
            const logs = JSON.parse(localStorage.getItem('catCareLogs') || '[]');
            const recentLogs = logs.slice(-7);

            const dates = recentLogs.map(l => l.date.slice(5));
            const peeData = recentLogs.map(l => l.pee);
            const poopData = recentLogs.map(l => l.poop);

            if (toiletChartInstance) toiletChartInstance.destroy();
            const ctx = document.getElementById('toiletChart').getContext('2d');
            toiletChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: dates,
                    datasets: [
                        { label: '🥔 감자(회)', data: peeData, backgroundColor: '#3b82f6' },
                        { label: '💩 맛동산(회)', data: poopData, backgroundColor: '#f59e0b' }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1 }
                        }
                    }
                }
            });

            const historyDiv = document.getElementById('logHistory');
            historyDiv.innerHTML = '';
            [...logs].reverse().forEach(log => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2 relative';
                
                let foodHtml = log.foods?.map(f => `• ${f.type} ${f.amount} ${f.time ? '('+f.time+')' : ''}`).join('<br>') || '-';
                let snackHtml = log.snacks?.map(s => `• ${s.type} ${s.amount} ${s.time ? '('+s.time+')' : ''}`).join('<br>') || '-';

                item.innerHTML = `
                    <div class="flex justify-between items-center font-bold text-slate-700 border-b pb-1">
                        <span class="cursor-pointer text-amber-600 hover:underline" onclick="loadLogForDate('${log.date}')">📅 ${log.date}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-normal bg-slate-200 px-2 py-0.5 rounded">🥔 ${log.pee}회 / 💩 ${log.poop}회</span>
                            <button onclick="deleteLog('${log.date}')" class="text-slate-400 hover:text-red-500 text-xs px-1">✕</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div><strong class="text-amber-600">🥣 밥:</strong><br>${foodHtml}</div>
                        <div><strong class="text-amber-600">🐟 간식:</strong><br>${snackHtml}</div>
                    </div>
                    ${log.supplements ? `<div class="text-xs text-slate-600"><strong>💊 약/영양제:</strong> ${log.supplements}</div>` : ''}
                    <div class="flex justify-between text-xs text-slate-500 pt-1 border-t">
                        <span>💧 음수량: ${log.water ? log.water + 'ml' : '-'}</span>
                        <span>⚖️ 체중: ${log.weight ? log.weight + 'kg' : '-'}</span>
                        <span>✨ 활력: ${log.vitality || '-'}</span>
                    </div>
                    ${log.memo ? `<div class="text-xs text-slate-600 bg-white p-2 rounded border mt-1">💬 ${log.memo}</div>` : ''}
                `;
                historyDiv.appendChild(item);
            });
        }

        window.onload = function() {
            resetForm(today);
            loadLogForDate(today);
            renderAll();
        };
    </script>
</body>
</html>

```
