<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>환묘 데일리 케어 노트 (실시간 공유용)</title>
    
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="apple-touch-icon" href="./favicon.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2canvas (화면 이미지 캡처/저장용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-12">

    <!-- 상단 헤더 -->
    <header class="bg-amber-500 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold">🐾 환묘 케어 노트</h1>
        <div class="flex items-center gap-1.5">
            <!-- 주간 리포트 이미지 저장 버튼 -->
            <button type="button" onclick="exportReportToImage()" class="text-xs bg-amber-700 hover:bg-amber-800 text-white font-bold px-2.5 py-1.5 rounded-lg shadow transition-colors flex items-center gap-1">
                📸 주간 리포트
            </button>
            <!-- 앱 강제 새로고침 (업데이트) 버튼 -->
            <button type="button" onclick="forceAppRefresh()" title="최신 데이터/코드 갱신" class="text-xs bg-amber-600 hover:bg-amber-700 text-white font-bold px-2 py-1.5 rounded-lg shadow transition-colors">
                🔄
            </button>
        </div>
    </header>

    <div class="max-w-md mx-auto p-4 space-y-5">

        <!-- 고양이 선택 탭 & 프로필 설정 -->
        <section class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center gap-2" id="catTabContainer">
                <button type="button" onclick="switchCat('cat1')" id="tab-cat1" class="flex-1 py-2.5 px-3 rounded-xl font-bold text-sm transition-all border flex items-center justify-center gap-1">
                    🐱 <span id="name-cat1">첫째</span>
                </button>
                <button type="button" onclick="switchCat('cat2')" id="tab-cat2" class="flex-1 py-2.5 px-3 rounded-xl font-bold text-sm transition-all border flex items-center justify-center gap-1">
                    🐱 <span id="name-cat2">둘째</span>
                </button>
            </div>
            <div class="mt-2 flex justify-between items-center px-1">
                <button type="button" onclick="openFoodManager()" class="text-[11px] text-amber-600 hover:text-amber-700 font-semibold underline">🥫 습식사료 수분DB 관리</button>
                <button type="button" onclick="editCatProfile()" class="text-[11px] text-slate-500 hover:text-slate-700 underline">⚙️ 고양이 프로필/이름 설정</button>
            </div>
        </section>

        <!-- 1. 오늘 케어 기록 입력 폼 -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-lg font-bold text-amber-600"><span id="formCatName">첫째</span>의 일기</h2>
                <input type="date" id="logDate" onchange="loadLogForDate(this.value)" class="p-2 border rounded-xl bg-slate-50 text-sm font-semibold focus:outline-amber-500">
            </div>

            <!-- 대소변 (감자 & 맛동산 Counter) -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-blue-50 p-3 rounded-xl text-center border border-blue-100 flex flex-col justify-between">
                    <div>
                        <label class="block text-sm font-bold text-blue-700 mb-1">🥔 감자 (소변)</label>
                        <div class="flex justify-center items-center gap-3 my-1">
                            <button type="button" onclick="changeVal('pee', -1)" class="w-8 h-8 bg-white shadow rounded-lg text-lg font-bold text-slate-600 active:scale-90">-</button>
                            <span id="peeCountDisplay" class="text-xl font-extrabold text-blue-900">0</span>
                            <button type="button" onclick="changeVal('pee', 1)" class="w-8 h-8 bg-white shadow rounded-lg text-lg font-bold text-slate-600 active:scale-90">+</button>
                        </div>
                    </div>
                    <div id="peeTimesDisplay" class="text-[11px] text-blue-600 font-medium min-h-[18px] bg-blue-100/50 rounded py-0.5 px-1 truncate mt-1">
                        시간: 없음
                    </div>
                </div>

                <div class="bg-amber-50 p-3 rounded-xl text-center border border-amber-100 flex flex-col justify-between">
                    <div>
                        <label class="block text-sm font-bold text-amber-800 mb-1">💩 맛동산 (대변)</label>
                        <div class="flex justify-center items-center gap-3 my-1">
                            <button type="button" onclick="changeVal('poop', -1)" class="w-8 h-8 bg-white shadow rounded-lg text-lg font-bold text-slate-600 active:scale-90">-</button>
                            <span id="poopCountDisplay" class="text-xl font-extrabold text-amber-900">0</span>
                            <button type="button" onclick="changeVal('poop', 1)" class="w-8 h-8 bg-white shadow rounded-lg text-lg font-bold text-slate-600 active:scale-90">+</button>
                        </div>
                    </div>
                    <div id="poopTimesDisplay" class="text-[11px] text-amber-700 font-medium min-h-[18px] bg-amber-100/50 rounded py-0.5 px-1 truncate mt-1">
                        시간: 없음
                    </div>
                </div>
            </div>

            <!-- 음수량 게이지 카운터 & 음수량 입력 카드 -->
            <div class="bg-cyan-50/70 p-4 rounded-2xl border border-cyan-100 space-y-3">
                <div class="flex justify-between items-center text-xs font-bold text-cyan-900">
                    <span>💧 오늘 음수 달성도</span>
                    <span id="waterGoalText">0 / 200 ml (0%)</span>
                </div>
                
                <!-- 게이지 바 (Progress Bar) -->
                <div class="w-full h-4 bg-cyan-100 rounded-full overflow-hidden p-0.5 shadow-inner relative">
                    <div id="waterProgressBar" class="h-full rounded-full transition-all duration-500 bg-rose-400 w-0"></div>
                </div>

                <div class="grid grid-cols-2 gap-2 text-[11px] text-cyan-800 pt-1">
                    <div class="bg-white/80 p-1.5 rounded-lg border border-cyan-100 text-center">
                        사료 수분량: <strong id="foodWaterCalcText" class="text-cyan-900">0ml</strong>
                    </div>
                    <div class="bg-white/80 p-1.5 rounded-lg border border-cyan-100 text-center">
                        직접/수액: <strong id="directWaterText" class="text-cyan-900">0ml</strong>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1 border-t border-cyan-100/60">
                    <label class="text-xs font-bold text-cyan-900">💧 직접 마신 물 / 수액 (ml)</label>
                    <input type="number" id="waterIntake" oninput="calculateTotalWater()" step="5" placeholder="예: 120" class="w-1/2 p-2 border rounded-xl bg-white text-sm font-bold text-right focus:outline-cyan-500">
                </div>
            </div>

            <!-- 밥 (식사 & 수분 자동 산출 연동) -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-bold text-slate-700">🥣 밥 (식사 수분 자동계산)</label>
                    <button type="button" onclick="addFoodRow()" class="text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded-lg font-bold">+ 항목 추가</button>
                </div>
                <div id="foodContainer" class="space-y-2"></div>
            </div>

            <!-- 간식 -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-bold text-slate-700">🐟 간식</label>
                    <button type="button" onclick="addSnackRow()" class="text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded-lg font-bold">+ 항목 추가</button>
                </div>
                <div id="snackContainer" class="space-y-2"></div>
            </div>

            <!-- 영양제 및 약 -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">💊 영양제 / 약 (종류 및 시간)</label>
                <input type="text" id="supplements" placeholder="예: 시스테이드 (9:30), 츄르약" class="w-full p-2 border rounded-xl bg-slate-50 text-sm">
            </div>

            <!-- 체중 & 활력 -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">⚖️ 체중 (kg)</label>
                    <input type="number" step="0.01" id="weight" placeholder="예: 4.15" class="w-full p-2 border rounded-xl bg-slate-50 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">✨ 활력 상태</label>
                    <input type="text" id="vitality" placeholder="예: OK, 양호, 기력없음" class="w-full p-2 border rounded-xl bg-slate-50 text-sm">
                </div>
            </div>

            <!-- 특이사항 메모 -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">💬 특이사항 메모</label>
                <textarea id="memo" rows="3" placeholder="예: 새벽에 화장실 들락날락함" class="w-full p-2 border rounded-xl bg-slate-50 text-sm"></textarea>
            </div>

            <button type="button" onclick="saveLog()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition-transform">
                오늘 기록 저장하기
            </button>
        </section>

        <!-- 2. 감자/맛동산/음수량 주간 리포트 (캡처 대상 영역) -->
        <section id="weeklyReportSection" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold mb-3 text-slate-700">📊 <span id="chartCatName">첫째</span>의 최근 7일 종합 리포트</h2>
            <div class="h-56 relative mb-2">
                <canvas id="toiletChart"></canvas>
            </div>
            <p class="text-[11px] text-slate-400 text-center">* 막대: 배변 횟수 / 꺾은선: 총 음수량 (ml)</p>
        </section>

        <!-- 3. 최근 기록 리스트 -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold mb-3 text-slate-700">📋 <span id="listCatName">첫째</span>의 저장된 일기</h2>
            <div id="logHistory" class="space-y-3 text-sm max-h-80 overflow-y-auto"></div>
        </section>
    </div>

    <!-- 스크립트 영역 통합 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPyDgOG6OsfTusf9AAiBv4r9Xjj1PPcEI",
            authDomain: "cat-care-note.firebaseapp.com",
            projectId: "cat-care-note",
            storageBucket: "cat-care-note.firebasestorage.app",
            messagingSenderId: "483819171134",
            appId: "1:483819171134:web:6111f0611d560b14eb106f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const defaultFoodDb = [
            { name: "알모네이처 HFC", moisture: 82 },
            { name: "로얄캐닌 인스턴티브 습식", moisture: 79 },
            { name: "힐스 k/d 캔", moisture: 77 },
            { name: "내추럴발란스 캔", moisture: 78 },
            { name: "건식사료 (일반)", moisture: 10 }
        ];

        window.currentCat = 'cat1';
        window.peeTimes = [];
        window.poopTimes = [];
        window.toiletChartInstance = null;
        window.allCatLogs = { cat1: [], cat2: [] };
        window.catProfiles = {
            cat1: { name: '첫째', weight: 4.0, birth: '' },
            cat2: { name: '둘째', weight: 4.0, birth: '' }
        };
        window.foodDb = [...defaultFoodDb];
        window.today = new Date().toISOString().split('T')[0];

        // 앱 강제 새로고침 트리거
        window.forceAppRefresh = function() {
            if (confirm("앱을 최신 상태로 새로고침하시겠습니까?")) {
                window.location.reload(true);
            }
        };

        // 파이어베이스 settings 수신
        onSnapshot(doc(db, "catCare", "settings"), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                if (data.profiles) window.catProfiles = data.profiles;
                if (data.foodDb) window.foodDb = data.foodDb;
            }
            updateCatNameUI();
            calculateTotalWater();
        });

        // 각 고양이 로그 수신
        ['cat1', 'cat2'].forEach(catId => {
            onSnapshot(doc(db, "catCare", `logs_${catId}`), (snapshot) => {
                window.allCatLogs[catId] = snapshot.exists() ? (snapshot.data().list || []) : [];
                if (window.currentCat === catId) {
                    renderAll();
                    const date = document.getElementById('logDate').value || window.today;
                    loadLogForDate(date);
                }
            });
        });

        function getCurrentTimeString() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        function updateToiletDisplay() {
            document.getElementById('peeCountDisplay').innerText = window.peeTimes.length;
            document.getElementById('peeTimesDisplay').innerText = window.peeTimes.length > 0 ? `시간: ${window.peeTimes.join(', ')}` : '시간: 없음';
            document.getElementById('poopCountDisplay').innerText = window.poopTimes.length;
            document.getElementById('poopTimesDisplay').innerText = window.poopTimes.length > 0 ? `시간: ${window.poopTimes.join(', ')}` : '시간: 없음';
        }

        window.calculateTotalWater = function() {
            const foodRows = document.querySelectorAll('#foodContainer .food-row');
            let foodWater = 0;

            foodRows.forEach(row => {
                const select = row.querySelector('.food-select');
                const amountInput = row.querySelector('.food-amount');
                if (select && amountInput) {
                    const moisture = parseFloat(select.options[select.selectedIndex]?.dataset?.moisture || 0);
                    const amountGrams = parseFloat(amountInput.value) || 0;
                    if (moisture > 0 && amountGrams > 0) {
                        foodWater += (amountGrams * (moisture / 100));
                    }
                }
            });

            const directWater = parseFloat(document.getElementById('waterIntake').value) || 0;
            const totalWater = Math.round(foodWater + directWater);

            const profile = window.catProfiles[window.currentCat] || { weight: 4.0 };
            const weight = parseFloat(profile.weight) || 4.0;
            const targetWater = Math.round(weight * 50);

            const pct = Math.min(Math.round((totalWater / targetWater) * 100), 100);
            const rawPct = Math.round((totalWater / targetWater) * 100);

            document.getElementById('foodWaterCalcText').innerText = `${Math.round(foodWater)}ml`;
            document.getElementById('directWaterText').innerText = `${Math.round(directWater)}ml`;
            document.getElementById('waterGoalText').innerText = `${totalWater} / ${targetWater} ml (${rawPct}%)`;

            const bar = document.getElementById('waterProgressBar');
            bar.style.width = `${pct}%`;

            if (rawPct < 50) bar.className = 'h-full rounded-full transition-all duration-500 bg-rose-400';
            else if (rawPct < 85) bar.className = 'h-full rounded-full transition-all duration-500 bg-amber-400';
            else if (rawPct <= 100) bar.className = 'h-full rounded-full transition-all duration-500 bg-emerald-500';
            else bar.className = 'h-full rounded-full transition-all duration-500 bg-cyan-500 shadow-sm animate-pulse';
        };

        window.changeVal = function(type, val) {
            const nowTime = getCurrentTimeString();
            if (type === 'pee') {
                if (val > 0) window.peeTimes.push(nowTime);
                else if (val < 0 && window.peeTimes.length > 0) window.peeTimes.pop();
            } else if (type === 'poop') {
                if (val > 0) window.poopTimes.push(nowTime);
                else if (val < 0 && window.poopTimes.length > 0) window.poopTimes.pop();
            }
            updateToiletDisplay();
        };

        window.saveLog = async function() {
            const date = document.getElementById('logDate').value;
            if (!date) { alert('날짜를 선택하세요.'); return; }

            const foods = getDynamicFoodData();
            const snacks = getDynamicData('snackContainer', 'snack-row', 'snack');

            // 당일 전체 음수량 자동 계산 및 저장
            let foodWater = 0;
            foods.forEach(f => {
                const item = window.foodDb.find(d => d.name === f.type);
                if (item && f.amount) foodWater += (parseFloat(f.amount) * (item.moisture / 100));
            });
            const directWater = parseFloat(document.getElementById('waterIntake').value) || 0;
            const calculatedTotalWater = Math.round(foodWater + directWater);

            const entry = {
                date,
                pee: window.peeTimes.length,
                peeTimes: [...window.peeTimes],
                poop: window.poopTimes.length,
                poopTimes: [...window.poopTimes],
                water: directWater,
                totalWater: calculatedTotalWater,
                foods,
                snacks,
                supplements: document.getElementById('supplements').value,
                weight: document.getElementById('weight').value,
                vitality: document.getElementById('vitality').value,
                memo: document.getElementById('memo').value
            };

            let logs = getCurrentLogs().filter(item => item.date !== date);
            logs.push(entry);
            logs.sort((a, b) => new Date(a.date) - new Date(b.date));

            await setDoc(doc(db, "catCare", `logs_${window.currentCat}`), { list: logs });
            alert(`${window.catProfiles[window.currentCat].name}의 기록이 저장되었습니다!`);
        };

        window.deleteLog = async function(targetDate) {
            if (!confirm(`${window.catProfiles[window.currentCat].name}의 ${targetDate} 기록을 삭제하시겠습니까?`)) return;
            let logs = getCurrentLogs().filter(item => item.date !== targetDate);
            await setDoc(doc(db, "catCare", `logs_${window.currentCat}`), { list: logs });
            if (document.getElementById('logDate').value === targetDate) resetForm();
        };

        window.editCatProfile = async function() {
            const p = window.catProfiles[window.currentCat] || { name: '첫째', weight: 4.0 };
            const newName = prompt(`[${p.name}]의 이름을 입력하세요:`, p.name);
            if (newName === null) return;
            const newWeight = prompt(`[${newName || p.name}]의 체중(kg)을 입력하세요:`, p.weight || 4.0);
            if (newWeight === null) return;

            window.catProfiles[window.currentCat] = {
                name: newName.trim() || p.name,
                weight: parseFloat(newWeight) || 4.0
            };

            updateCatNameUI();
            calculateTotalWater();
            await setDoc(doc(db, "catCare", "settings"), { profiles: window.catProfiles }, { merge: true });
        };

        window.openFoodManager = async function() {
            let dbStr = window.foodDb.map(f => `${f.name}:${f.moisture}`).join('\n');
            let input = prompt("습식사료 수분함량(%) 목록을 입력/수정하세요 (형식: 제품명:수분%):", dbStr);
            if (input === null) return;

            let newDb = [];
            input.split('\n').forEach(line => {
                let parts = line.split(':');
                if (parts.length === 2 && parts[0].trim() && !isNaN(parts[1])) {
                    newDb.push({ name: parts[0].trim(), moisture: parseFloat(parts[1].trim()) });
                }
            });

            if (newDb.length > 0) {
                window.foodDb = newDb;
                await setDoc(doc(db, "catCare", "settings"), { foodDb: newDb }, { merge: true });
                alert("사료 DB가 업데이트되었습니다!");
                renderFoodSelectOptions();
            }
        };

        function getCurrentLogs() {
            return window.allCatLogs[window.currentCat] || [];
        }

        window.updateCatNameUI = function() {
            const p = window.catProfiles;
            document.getElementById('name-cat1').innerText = p.cat1?.name || '첫째';
            document.getElementById('name-cat2').innerText = p.cat2?.name || '둘째';
            document.getElementById('formCatName').innerText = p[window.currentCat]?.name || '첫째';
            document.getElementById('chartCatName').innerText = p[window.currentCat]?.name || '첫째';
            document.getElementById('listCatName').innerText = p[window.currentCat]?.name || '첫째';
        };

        window.switchCat = function(catId) {
            window.currentCat = catId;
            ['cat1', 'cat2'].forEach(id => {
                const btn = document.getElementById(`tab-${id}`);
                btn.className = (id === catId) 
                    ? 'flex-1 py-2.5 px-3 rounded-xl font-bold text-sm transition-all bg-amber-500 text-white border-amber-500 shadow-sm'
                    : 'flex-1 py-2.5 px-3 rounded-xl font-bold text-sm transition-all bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100';
            });

            updateCatNameUI();
            const date = document.getElementById('logDate').value || window.today;
            loadLogForDate(date);
            renderAll();
        };

        window.addFoodRow = function(type = '', amount = '', time = '') {
            const container = document.getElementById('foodContainer');
            const row = document.createElement('div');
            row.className = 'flex gap-1.5 items-center food-row';
            
            let options = `<option value="" data-moisture="0">사료 선택 (수분%)</option>`;
            window.foodDb.forEach(f => {
                const selected = (f.name === type) ? 'selected' : '';
                options += `<option value="${f.name}" data-moisture="${f.moisture}" ${selected}>${f.name} (${f.moisture}%)</option>`;
            });

            row.innerHTML = `
                <select onchange="calculateTotalWater()" class="food-select w-5/12 p-2 border rounded-lg bg-slate-50 text-xs font-semibold">
                    ${options}
                </select>
                <input type="number" oninput="calculateTotalWater()" placeholder="급여량(g)" value="${amount}" class="food-amount w-3/12 p-2 border rounded-lg bg-slate-50 text-xs font-semibold">
                <input type="text" placeholder="시간" value="${time}" class="food-time w-3/12 p-2 border rounded-lg bg-slate-50 text-xs">
                <button type="button" onclick="this.parentElement.remove(); calculateTotalWater();" class="text-red-400 font-bold px-1 text-sm">✕</button>
            `;
            container.appendChild(row);
            calculateTotalWater();
        };

        function renderFoodSelectOptions() {
            document.querySelectorAll('#foodContainer .food-select').forEach(select => {
                const currentVal = select.value;
                let options = `<option value="" data-moisture="0">사료 선택 (수분%)</option>`;
                window.foodDb.forEach(f => {
                    const selected = (f.name === currentVal) ? 'selected' : '';
                    options += `<option value="${f.name}" data-moisture="${f.moisture}" ${selected}>${f.name} (${f.moisture}%)</option>`;
                });
                select.innerHTML = options;
            });
        }

        window.addSnackRow = function(type = '', amount = '', time = '') {
            const container = document.getElementById('snackContainer');
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-center snack-row';
            row.innerHTML = `
                <input type="text" placeholder="종류(예: 홍살 달고기)" value="${type}" class="snack-type w-1/3 p-2 border rounded-lg bg-slate-50 text-xs">
                <input type="text" placeholder="양(예: 1/2)" value="${amount}" class="snack-amount w-1/3 p-2 border rounded-lg bg-slate-50 text-xs">
                <input type="text" placeholder="시간" value="${time}" class="snack-time w-1/3 p-2 border rounded-lg bg-slate-50 text-xs">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 font-bold px-1 text-sm">✕</button>
            `;
            container.appendChild(row);
        };

        function getDynamicFoodData() {
            const rows = document.querySelectorAll('#foodContainer .food-row');
            const data = [];
            rows.forEach(row => {
                const select = row.querySelector('.food-select');
                const type = select.value || '';
                const amount = row.querySelector('.food-amount').value.trim();
                const time = row.querySelector('.food-time').value.trim();
                if (type || amount || time) {
                    data.push({ type, amount, time });
                }
            });
            return data;
        }

        function getDynamicData(containerId, rowClass, prefix) {
            const rows = document.querySelectorAll(`#${containerId} .${rowClass}`);
            const data = [];
            rows.forEach(row => {
                const type = row.querySelector(`.${prefix}-type`).value.trim();
                const amount = row.querySelector(`.${prefix}-amount`).value.trim();
                const time = row.querySelector(`.${prefix}-time`).value.trim();
                if (type || amount || time) {
                    data.push({ type, amount, time });
                }
            });
            return data;
        }

        window.loadLogForDate = function(selectedDate) {
            resetForm(selectedDate);
            const logs = getCurrentLogs();
            const log = logs.find(item => item.date === selectedDate);

            if (log) {
                window.peeTimes = log.peeTimes || (log.pee ? Array(log.pee).fill('기록없음') : []);
                window.poopTimes = log.poopTimes || (log.poop ? Array(log.poop).fill('기록없음') : []);
                updateToiletDisplay();

                document.getElementById('waterIntake').value = log.water || '';

                document.getElementById('foodContainer').innerHTML = '';
                if (log.foods && log.foods.length > 0) {
                    log.foods.forEach(f => addFoodRow(f.type, f.amount, f.time));
                } else {
                    addFoodRow();
                }

                document.getElementById('snackContainer').innerHTML = '';
                if (log.snacks && log.snacks.length > 0) {
                    log.snacks.forEach(s => addSnackRow(s.type, s.amount, s.time));
                } else {
                    addSnackRow();
                }

                document.getElementById('supplements').value = log.supplements || '';
                document.getElementById('weight').value = log.weight || '';
                document.getElementById('vitality').value = log.vitality || '';
                document.getElementById('memo').value = log.memo || '';
            }
            calculateTotalWater();
        };

        function resetForm(targetDate = window.today) {
            document.getElementById('logDate').value = targetDate;
            document.getElementById('currentDateDisplay').innerText = targetDate;
            window.peeTimes = [];
            window.poopTimes = [];
            updateToiletDisplay();

            document.getElementById('waterIntake').value = '';
            document.getElementById('foodContainer').innerHTML = '';
            document.getElementById('snackContainer').innerHTML = '';
            document.getElementById('supplements').value = '';
            document.getElementById('weight').value = '';
            document.getElementById('vitality').value = '';
            document.getElementById('memo').value = '';
            addFoodRow();
            addSnackRow();
            calculateTotalWater();
        }

        // 최근 7일 종합 리포트 이미지 저장 기능 (html2canvas 활용)
        window.exportReportToImage = function() {
            const section = document.getElementById('weeklyReportSection');
            const catName = window.catProfiles[window.currentCat]?.name || '고양이';
            
            alert('주간 리포트 이미지를 생성합니다. 잠시만 기다려주세요!');

            html2canvas(section, { scale: 2 }).then(canvas => {
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.href = image;
                link.download = `${catName}_주간케어리포트_${window.today}.png`;
                link.click();
            });
        };

        // 복합 차트 (배변 막대그래프 + 음수량 꺾은선 그래프)
        function renderAll() {
            const logs = getCurrentLogs();
            const recentLogs = logs.slice(-7);

            const dates = recentLogs.map(l => l.date.slice(5));
            const peeData = recentLogs.map(l => l.pee);
            const poopData = recentLogs.map(l => l.poop);
            const waterData = recentLogs.map(l => l.totalWater || l.water || 0);

            if (window.toiletChartInstance) window.toiletChartInstance.destroy();
            const ctx = document.getElementById('toiletChart').getContext('2d');
            
            window.toiletChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: dates,
                    datasets: [
                        { type: 'bar', label: '🥔 감자(회)', data: peeData, backgroundColor: '#3b82f6', yAxisID: 'y' },
                        { type: 'bar', label: '💩 맛동산(회)', data: poopData, backgroundColor: '#f59e0b', yAxisID: 'y' },
                        { type: 'line', label: '💧 음수량(ml)', data: waterData, borderColor: '#06b6d4', backgroundColor: '#06b6d4', borderWidth: 2, fill: false, tension: 0.2, yAxisID: 'y1' }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: { 
                        y: { type: 'linear', display: true, position: 'left', beginAtZero: true, ticks: { stepSize: 1 }, title: { display: true, text: '횟수' } },
                        y1: { type: 'linear', display: true, position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, title: { display: true, text: 'ml' } }
                    }
                }
            });

            const historyDiv = document.getElementById('logHistory');
            historyDiv.innerHTML = '';
            [...logs].reverse().forEach(log => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2 relative';
                
                let foodHtml = log.foods?.map(f => `• ${f.type} ${f.amount ? f.amount+'g' : ''} ${f.time ? '('+f.time+')' : ''}`).join('<br>') || '-';
                let snackHtml = log.snacks?.map(s => `• ${s.type} ${s.amount} ${s.time ? '('+s.time+')' : ''}`).join('<br>') || '-';

                const peeTimeTxt = log.peeTimes && log.peeTimes.length > 0 ? `(${log.peeTimes.join(', ')})` : '';
                const poopTimeTxt = log.poopTimes && log.poopTimes.length > 0 ? `(${log.poopTimes.join(', ')})` : '';

                item.innerHTML = `
                    <div class="flex justify-between items-center font-bold text-slate-700 border-b pb-1">
                        <span class="cursor-pointer text-amber-600 hover:underline" onclick="loadLogForDate('${log.date}')">📅 ${log.date}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-normal bg-slate-200 px-2 py-0.5 rounded">
                                🥔 ${log.pee}회 ${peeTimeTxt} / 💩 ${log.poop}회 ${poopTimeTxt}
                            </span>
                            <button onclick="deleteLog('${log.date}')" class="text-slate-400 hover:text-red-500 text-xs px-1">✕</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div><strong class="text-amber-600">🥣 밥:</strong><br>${foodHtml}</div>
                        <div><strong class="text-amber-600">🐟 간식:</strong><br>${snackHtml}</div>
                    </div>
                    ${log.supplements ? `<div class="text-xs text-slate-600"><strong>💊 약/영양제:</strong> ${log.supplements}</div>` : ''}
                    <div class="flex justify-between text-xs text-slate-500 pt-1 border-t">
                        <span>💧 총음수: ${log.totalWater ? log.totalWater + 'ml' : (log.water ? log.water + 'ml' : '-')}</span>
                        <span>⚖️ 체중: ${log.weight ? log.weight + 'kg' : '-'}</span>
                        <span>✨ 활력: ${log.vitality || '-'}</span>
                    </div>
                    ${log.memo ? `<div class="text-xs text-slate-600 bg-white p-2 rounded border mt-1">💬 ${log.memo}</div>` : ''}
                `;
                historyDiv.appendChild(item);
            });
        }

        window.switchCat('cat1');
    </script>
</body>
</html>
